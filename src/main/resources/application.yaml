server:
  port: ${PORT:8080}

spring:
  application:
    name: devlink-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devlink}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:devlink_super_secret_jwt_key_for_dev_environment_32bytes_long}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  otp:
    expiry-minutes: 5
    max-attempts: 5
    length: 6
  bootstrap-admin:
    email: shubhamg3203068@gmail.com
    username: shubham
    password: 1234

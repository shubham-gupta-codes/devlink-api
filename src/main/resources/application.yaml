server:
  port: 8080

spring:
  application:
    name: devlink-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  otp:
    expiry-minutes: 5
    max-attempts: 5
    length: 6
  bootstrap-admin:
    email: shubhamg3203068@gmail.com
    username: shubham
    password: 1234
